services:
  api-gateway:
    image: python:3.12-slim
    container_name: finance-assistant-api
    working_dir: /app
    volumes:
      - ./services/api-gateway:/app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
